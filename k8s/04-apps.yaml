apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: auction-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: auction-platform/user-service:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - uvicorn main:app --host 0.0.0.0 --port 8001
          workingDir: /service/src
          ports:
            - containerPort: 8001
          env:
            - name: POSTGRES_HOST
              value: db-users
            - name: POSTGRES_DB
              value: auction_users
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: auction-platform-config
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: auction-platform-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auction-platform-secrets
                  key: POSTGRES_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: auction-platform-secrets
                  key: SECRET_KEY
          readinessProbe:
            httpGet:
              path: /api/v1/internal/health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/internal/health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: auction-platform
spec:
  selector:
    app: user-service
  ports:
    - port: 8001
      targetPort: 8001
---
