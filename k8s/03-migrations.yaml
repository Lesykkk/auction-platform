apiVersion: batch/v1
kind: Job
metadata:
  name: user-service-migrations
  namespace: auction-platform
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: user-service-migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: auction-platform/user-service:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - alembic upgrade head
          workingDir: /service/src
          env:
            - name: POSTGRES_HOST
              value: db-users
            - name: POSTGRES_DB
              value: auction_users
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: auction-platform-config
                  key: POSTGRES_PORT
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: auction-platform-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auction-platform-secrets
                  key: POSTGRES_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: auction-platform-secrets
                  key: SECRET_KEY
---
apiVersion: batch/v1
