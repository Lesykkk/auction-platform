      labels:
        app: auction-service-migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: auction-platform/auction-service:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - alembic upgrade head
          workingDir: /service/src
          env:
            - name: POSTGRES_HOST
              value: db-auctions
            - name: POSTGRES_DB
              value: auction_auctions
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
