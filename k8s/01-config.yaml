apiVersion: v1
kind: ConfigMap
metadata:
  name: auction-platform-config
  namespace: auction-platform
data:
  POSTGRES_PORT: "5432"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  AUCTION_CACHE_TTL_SECONDS: "60"
---
apiVersion: v1
kind: Secret
metadata:
  name: auction-platform-secrets
  namespace: auction-platform
type: Opaque
stringData:
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: admin
  SECRET_KEY: change-me-before-sharing
